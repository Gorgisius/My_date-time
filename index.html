<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Date</title>
    <link rel="stylesheet" href="style.css">
</head>
<script type="module" src="./index.js"></script>
<body class="text-white bg-gray-950 relative h-screen">
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 font-mono">
        <!-- Dropdown -->
        <div class="dropdown relative">
            <button id="change_tz" class="flex cursor-pointer items-center">
                <p id="location" class="text-[20px]">Loading...</p>
                <p class="w-5 ml-1">▼</p>
            </button>
            <div id="ddcontent" class="content hidden absolute bg-gray-800 p-5 rounded-md">
                <button class="block cursor-pointer p-1 hover:font-semibold action">America/Mazatlan</button>
                <button class="block cursor-pointer p-1 hover:font-semibold action">America/New_York</button>
                <button class="block cursor-pointer p-1 hover:font-semibold action">Europe/London</button>
                <button class="block cursor-pointer p-1 hover:font-semibold action">Europe/Paris</button>
                <button class="block cursor-pointer p-1 hover:font-semibold action">Australia/Sydney</button>
            </div>
        </div>
        <h1 id="time" class="text-right text-[7rem]">00:00:00</h1>
        <h2 id="date" class="text-right text-[2rem]"></h2>
    </div>
</body>
</html>
